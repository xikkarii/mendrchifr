name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Find EXE
        shell: powershell
        run: |
          Get-ChildItem -Recurse build -Filter *.exe

      - name: Deploy Qt
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse build -Filter MeandrCipher.exe | Select-Object -First 1

          if (-not $exe) {
            Write-Error "MeandrCipher.exe not found"
            exit 1
          }

          Write-Host "Found EXE: $($exe.FullName)"

          windeployqt --release $exe.FullName

      - name: Package
        shell: powershell
        run: |
          Compress-Archive `
            -Path build/Release/* `
            -DestinationPath MeandrCipher-Windows.zip `
            -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeandrCipher-Windows
          path: MeandrCipher-Windows.zip
